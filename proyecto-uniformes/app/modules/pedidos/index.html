<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Portal Tela&Corte</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="pedidos.css">
</head>
<body>

<div class="portal">
  <div id="sidebar-container"></div>

  <main class="contenido">
    <div class="topbar">
      <div>
        <span class="topbar__eyebrow">Módulo 01</span>
        <h1>Gestión de pedidos</h1>
        <p>Registra, consulta, modifica y da seguimiento a los pedidos de los clientes.</p>
      </div>
    </div>

    <div class="tarjetas-kpi" id="kpi-pedidos"></div>

    <section class="panel">
      <div class="panel__cab">
        <h2>Nuevo pedido</h2>
      </div>
      <form id="form-pedido">
        <div class="form-grid">
          <div class="campo">
            <label for="p-cliente">Cliente</label>
            <input type="text" id="p-cliente" required placeholder="Nombre del cliente o empresa">
          </div>
          <div class="campo">
            <label for="p-tipo">Tipo de uniforme</label>
            <select id="p-tipo">
              <option>Escolar</option>
              <option>Industrial</option>
              <option>Corporativo</option>
            </select>
          </div>
          <div class="campo">
            <label for="p-talla">Talla(s)</label>
            <input type="text" id="p-talla" placeholder="Ej. S, M, L o rango">
          </div>
          <div class="campo">
            <label for="p-cantidad">Cantidad</label>
            <input type="number" id="p-cantidad" min="1" required placeholder="Ej. 50">
          </div>
          <div class="campo">
            <label for="p-fecha">Fecha de entrega</label>
            <input type="date" id="p-fecha" required>
          </div>
          <div class="campo">
            <label for="p-estado">Estado inicial</label>
            <select id="p-estado">
              <option>Pendiente</option>
              <option>En producción</option>
              <option>Listo</option>
              <option>Entregado</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn--primario btn--sm">Registrar pedido</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel__cab">
        <h2>Pedidos registrados</h2>
        <select id="filtro-estado" class="icon-btn">
          <option value="todos">Todos los estados</option>
          <option value="Pendiente">Pendiente</option>
          <option value="En producción">En producción</option>
          <option value="Listo">Listo</option>
          <option value="Entregado">Entregado</option>
        </select>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Cliente</th><th>Tipo</th><th>Talla</th><th>Cant.</th><th>Entrega</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-pedidos"></tbody>
        </table>
        <p class="vacio" id="pedidos-vacio" style="display:none;">Aún no hay pedidos registrados. Usa el formulario de arriba para crear el primero.</p>
      </div>
    </section>
  </main>
</div>

<script src="../../js/auth.js"></script>
<script src="../../js/sidebar.js"></script>
<script>
  protegerPagina('../../login.html');
  construirSidebar('pedidos', '../../');
</script>
<script src="pedidos.js"></script>
</body>
</html>
